{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F3A5F">
  <title>{% block title %}Daily Signal{% endblock %}</title>
  <link rel="manifest" href="{% url 'horoscope:manifest' %}">
  <link rel="stylesheet" href="{% static 'horoscope/app.css' %}">
  <link rel="apple-touch-icon" href="{% static 'horoscope/icons/icon-192.png' %}">
</head>
<body>
  <main class="screen">
    {% block content %}{% endblock %}
  </main>

  {% block tabbar %}
  <nav class="tabbar">
    <a href="{% url 'horoscope:dashboard' %}" class="tab {% block tab_today %}{% endblock %}">
      <span class="tab-glyph">▰</span><span>Today</span>
    </a>
    <a href="{% url 'horoscope:forecast' %}" class="tab {% block tab_forecast %}{% endblock %}">
      <span class="tab-glyph">∿</span><span>Forecast</span>
    </a>
    <a href="{% url 'horoscope:blueprint' %}" class="tab {% block tab_blueprint %}{% endblock %}">
      <span class="tab-glyph">▦</span><span>Blueprint</span>
    </a>
  </nav>
  {% endblock %}

  <script src="{% static 'horoscope/js/sw-register.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
